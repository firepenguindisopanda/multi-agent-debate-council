{% extends "auth/_layout.html" %}
{% block title %}Create account{% endblock %}
{% block form %}
<h1>Create your account</h1>
<p class="sub">Put your next requirement on trial in under a minute.</p>
<form method="post" action="{{ url_for('signup_user') }}" class="stack" novalidate>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <div class="field">
    <label class="label" for="username">Username</label>
    <input class="input" id="username" name="username" value="{{ username or '' }}" autocomplete="username" minlength="3" maxlength="30" required autofocus>
  </div>
  <div class="field">
    <label class="label" for="email">Email</label>
    <input class="input" id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
  </div>
  <div class="field">
    <label class="label" for="password">Password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint">
    <span class="hint" id="pw-hint">At least 8 characters.</span>
  </div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
</form>
<p class="auth-switch">Already have an account? <a href="{{ url_for('login_view') }}">Sign in</a></p>
{% endblock %}
