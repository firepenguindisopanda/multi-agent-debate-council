<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Debate Council{% endblock %} · Debate Council</title>
  <meta name="description" content="Convene a council of AI specialists to stress-test your software requirements.">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"4..","swap":true},{"code":"503","swap":true},{"code":"5..","swap":false,"error":true}],"defaultSwapStyle":"innerHTML"}'>
  <link rel="icon" href="{{ url_for('static', path='img/favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', path='css/app.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', path='vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/htmx-ext-sse-2.2.2.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body>
  {% block body %}{% endblock %}
  <div id="toasts" class="toasts" aria-live="polite">
    {% for flashed in get_flashed_messages(request) %}
      {% with message = flashed.message, kind = flashed.type %}{% include "partials/toast.html" %}{% endwith %}
    {% endfor %}
  </div>
</body>
</html>
